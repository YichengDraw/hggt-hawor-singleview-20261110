<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="description" content="HGGT 与 HaWoR 在同一单相机视频上的手部重建复现、同步回放和逐序列评价。">

<body>
  <a class="skip-link" href="#samples">跳到视频对比</a>

  <footer><span>HGGT / HaWoR · 逐帧复现记录</span><a href="#">回到顶部 ↑</a></footer>
